name: Windows build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Prepare x64 runtime-hook compiler
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'tcc-win64.zip'
          Invoke-WebRequest 'https://download.savannah.gnu.org/releases/tinycc/tcc-0.9.27-win64-bin.zip' -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne '34A721949A2583FDFF725312DA092FA0F5F1F284B702E6F811C6954714FAABB2') { throw 'Unexpected TinyCC archive hash' }
          $directory = Join-Path $env:RUNNER_TEMP 'tcc-toolchain'
          Expand-Archive $zip -DestinationPath $directory
          "UNIDOT_TCC=$directory/tcc/tcc.exe" >> $env:GITHUB_ENV

      - name: Build
        run: dotnet build Unidot.sln -c Release --verbosity minimal

      - name: Tests without Unity installation
        run: dotnet run --project tests/Unidot.Tests -c Release --no-build

      - name: Publish CLI directory
        run: dotnet publish src/Unidot -c Release --no-restore -o artifacts/unidot

      - name: Pack .NET Tool
        run: dotnet pack src/Unidot -c Release --no-build -o artifacts/packages

      - name: Verify local package installation
        shell: pwsh
        run: |
          dotnet tool install --tool-path artifacts/tool-smoke Net.BITKit.Unidot --configfile .github/nuget-smoke.config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./artifacts/tool-smoke/unidot.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./artifacts/tool-smoke/unidot.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/Unidot.Tests -c Release --no-build -- --installed-cli-smoke "$((Resolve-Path './artifacts/tool-smoke/unidot.exe').Path)"
          exit $LASTEXITCODE

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unidot-windows
          path: |
            artifacts/unidot/**
            artifacts/packages/*.nupkg
